name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # build number = commit count

      - name: Build universal app
        run: make zip ARCHS="arm64 x86_64"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MenuBarClear
          path: build/MenuBarClear-*.zip

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/MenuBarClear-*.zip
          generate_release_notes: true
